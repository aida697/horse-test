<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kazbegi Premium Horse Tours</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --vh: 1vh;
            --font-serif: "Playfair Display", Georgia, serif;
            --font-sans: "Inter", system-ui, sans-serif;
            --color-lux-gold: #c5a880;
            --color-lux-black: #111111;
            --color-lux-gray: #1c1c1e;
            --color-lux-cream: #f4f1eb;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-lux-cream);
            color: var(--color-lux-black);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body.rtl {
            direction: rtl;
            font-family: system-ui, sans-serif;
        }

        /* Prevent background layout bouncing when sheet modals open */
        body.scroll-locked {
            position: fixed;
            width: 100%;
            overflow: hidden;
        }

        .serif-title {
            font-family: var(--font-serif);
        }

        /* --- PRESTIGE INTRO SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: var(--color-lux-black);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
        }

        .lang-select-btn {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lang-select-btn:hover {
            border-color: var(--color-lux-gold);
            color: var(--color-lux-gold);
            transform: translateY(-2px);
        }

        /* --- CINEMATIC TOUR CARD CATALOG --- */
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .premium-tour-card {
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .premium-tour-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(17,17,17,0.08);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background-color: #eaeaea;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .premium-tour-card:hover .card-img {
            transform: scale(1.06);
        }

        .card-price-tag {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        body.rtl .card-price-tag {
            right: auto;
            left: 16px;
        }

        .card-body {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body h3 {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--color-lux-black);
            letter-spacing: -0.3px;
        }

        .card-arrow {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--color-lux-cream);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--color-lux-black);
            transition: all 0.4s ease;
        }

        .premium-tour-card:hover .card-arrow {
            background-color: var(--color-lux-black);
            color: #ffffff;
        }

        body.rtl .card-arrow svg {
            transform: scaleX(-1);
        }

        /* --- EDITORIAL BOTTOM MODAL SHEET --- */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(17, 17, 17, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        #tour-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #ffffff;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            z-index: 101;
            max-height: 92%;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #tour-modal.active {
            transform: translateY(0);
        }

        /* Inline Smooth Gallery Slider */
        .slideshow-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background-color: #111;
        }

        .slideshow-scroll-container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .slideshow-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .slide-frame {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            cursor: zoom-in;
        }

        .slide-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-dots-indicator {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .slide-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .slide-dot.active {
            width: 18px;
            border-radius: 100px;
            background-color: #ffffff;
        }

        .metric-item {
            background-color: var(--color-lux-cream);
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metric-item svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .gear-card {
            background: #ffffff;
            border: 1px solid #eef0eb;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gear-card svg {
            width: 16px;
            height: 16px;
            stroke: var(--color-lux-gold);
            fill: none;
            stroke-width: 3;
        }

        /* --- CONCIERGE CHAT INTERFACE --- */
        #chat-interface {
            position: fixed;
            inset: 0;
            background-color: var(--color-lux-cream);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.rtl #chat-interface {
            transform: translateX(-100%);
        }

        #chat-interface.active {
            transform: translateX(0);
        }

        .chat-box-stream {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrapper.system {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.98rem;
            line-height: 1.45;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .msg-wrapper.user .msg-bubble {
            background-color: var(--color-lux-black);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        body.rtl .msg-wrapper.user .msg-bubble {
            border-bottom-right-radius: 22px;
            border-bottom-left-radius: 4px;
        }

        .msg-wrapper.system .msg-bubble {
            background-color: #ffffff;
            color: var(--color-lux-black);
            border-bottom-left-radius: 4px;
            border: 1px solid #eef0eb;
        }
        body.rtl .msg-wrapper.system .msg-bubble {
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 4px;
        }

        .msg-meta {
            font-size: 0.72rem;
            color: #8e8e93;
            margin-top: 4px;
            padding: 0 4px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .msg-meta svg {
            width: 10px;
            height: 10px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .status-seen {
            color: var(--color-lux-gold);
            font-weight: 500;
        }

        /* Interactive Dynamic Customizer Form Inside Chat */
        .chat-form-box {
            background-color: #ffffff;
            border-radius: 24px;
            border: 1px solid #eef0eb;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            align-self: flex-start;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-form-box h4 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .chat-form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-form-group label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8e8e93;
            font-weight: 600;
        }

        .chip-flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .luxury-chip {
            background-color: var(--color-lux-cream);
            padding: 8px 14px;
            border-radius: 100px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }

        .luxury-chip:hover {
            background-color: #eaeaea;
        }

        .luxury-chip.active {
            background-color: var(--color-lux-black);
            color: #ffffff;
            border-color: var(--color-lux-black);
        }

        .calendar-bubble {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            min-width: 55px;
            padding: 8px 6px;
        }

        .calendar-bubble span {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1;
        }

        .calendar-bubble .sub-month {
            font-size: 0.68rem;
            font-weight: 500;
            margin-top: 2px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* --- CONTACT CAPTURE INTERSTITIAL POPUP --- */
        #contact-popup {
            position: fixed;
            inset: 0;
            background-color: rgba(17, 17, 17, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #contact-popup.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-card {
            background-color: #ffffff;
            border-radius: 28px;
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #contact-popup.active .popup-card {
            transform: scale(1);
        }

        .tag-btn {
            flex: 1;
            padding: 10px;
            border-radius: 14px;
            background-color: var(--color-lux-cream);
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .tag-btn.selected {
            border-color: var(--color-lux-black);
            background-color: var(--color-lux-black);
            color: #ffffff;
        }

        /* --- ZOOM LIGHTBOX --- */
        #lightbox-zoom {
            position: fixed;
            inset: 0;
            background-color: rgba(11, 11, 11, 0.95);
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        #lightbox-zoom.active {
            opacity: 1;
            visibility: visible;
        }

        #lightbox-target-img {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 8px;
        }
    </style>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="splash-screen">
        <div class="text-center mb-12 px-6">
            <h1 class="serif-title text-4xl md:text-5xl text-[#f4f1eb] tracking-wide mb-3">KAZBEGI</h1>
            <p class="text-xs uppercase tracking-[0.25em] text-[#c5a880] font-semibold">Premium Horse Riding Experiences</p>
        </div>
        
        <div class="flex flex-col gap-3 w-full max-w-[280px] px-4">
            <button onclick="setLanguage('en')" class="lang-select-btn text-white py-3.5 px-6 rounded-xl text-[0.95rem] font-medium flex justify-between items-center">
                <span>English</span> <span class="text-xs opacity-40 font-light">Select</span>
            </button>
            <button onclick="setLanguage('ka')" class="lang-select-btn text-white py-3.5 px-6 rounded-xl text-[0.95rem] font-medium flex justify-between items-center">
                <span>ქართული</span> <span class="text-xs opacity-40 font-light">არჩევა</span>
            </button>
            <button onclick="setLanguage('ru')" class="lang-select-btn text-white py-3.5 px-6 rounded-xl text-[0.95rem] font-medium flex justify-between items-center">
                <span>Русский</span> <span class="text-xs opacity-40 font-light">Выбрать</span>
            </button>
            <button onclick="setLanguage('ar')" class="lang-select-btn text-white py-3.5 px-6 rounded-xl text-[0.95rem] font-medium flex justify-between items-center">
                <span>العربية</span> <span class="text-xs opacity-40 font-light">اختر</span>
            </button>
        </div>
    </div>


    <div id="main-content">
        <header class="relative px-6 pt-16 pb-10 max-w-5xl mx-auto flex flex-col gap-2">
            <span id="hero-tag" class="text-xs font-bold tracking-[0.2em] text-[#c5a880] uppercase">Stepantsminda, Georgia</span>
            <h2 id="hero-title" class="serif-title text-4xl md:text-6xl font-bold tracking-tight text-[#111111] leading-[1.1]">Ride into the Caucasus Peaks</h2>
        </header>

        <main class="max-w-5xl mx-auto px-6 pb-24">
            <h3 id="sec-header" class="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-6">Selected Journeys</h3>
            
            <div id="tour-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
        </main>
    </div>


    <div id="modal-overlay" onclick="closeTourModal()"></div>
    
    <div id="tour-modal" role="dialog" aria-modal="true">
        <div class="w-full flex justify-center py-3.5 cursor-pointer" onclick="closeTourModal()">
            <div class="w-12 h-1 rounded-full bg-neutral-200"></div>
        </div>

        <div class="flex-1 overflow-y-auto pb-10">
            <div class="slideshow-wrapper">
                <div id="modal-slideshow-container" class="slideshow-scroll-container" onscroll="updateSlideshowDots()">
                    </div>
                <div id="modal-slideshow-nav" class="slide-dots-indicator"></div>
            </div>

            <div class="px-6 pt-6 flex flex-col gap-4">
                <h2 id="modal-title" class="serif-title text-2xl md:text-3xl font-bold text-[#111111]"></h2>
                <p id="modal-desc" class="text-neutral-600 text-[1rem] leading-relaxed font-normal"></p>
                
                <div id="modal-metric-box" class="grid grid-cols-2 gap-3 mt-2">
                    </div>

                <hr class="border-neutral-100 my-3">

                <div class="flex flex-col gap-3">
                    <h4 id="modal-gear-title" class="text-xs font-bold uppercase tracking-wider text-neutral-400">What to Bring Along</h4>
                    <div id="modal-gear-box" class="flex flex-col gap-2">
                        </div>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-neutral-100 bg-white safe-bottom">
            <button id="btn-modal-book" onclick="openChatInterface()" class="w-full bg-[#111111] text-white py-4 px-6 rounded-2xl text-[0.98rem] font-semibold transition-transform active:scale-[0.98] shadow-lg shadow-black/5">
                Customize & Open Chat Line
            </button>
        </div>
    </div>


    <div id="chat-interface">
        <header class="bg-white border-b border-neutral-100 px-4 py-3.5 flex justify-between items-center shrink-0">
            <button onclick="closeChatInterface()" class="p-2 -ml-2 text-neutral-800 active:opacity-50">
                <svg class="w-6 height-6 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            
            <div class="text-center flex flex-col items-center">
                <h3 id="chat-owner-name" class="font-semibold text-[0.98rem] text-neutral-900">Dato (Host)</h3>
                <span id="chat-live-status" class="text-[0.68rem] text-emerald-600 font-medium tracking-wide">● Stables Connected</span>
            </div>
            
            <div class="w-10"></div> </header>

        <div id="chat-box-stream" class="chat-box-stream">
            </div>

        <div class="p-4 bg-white border-t border-neutral-100 flex gap-2 items-center safe-bottom">
            <input type="text" id="chat-custom-message" placeholder="Type custom query..." class="flex-1 bg-neutral-50 border border-neutral-200 rounded-2xl px-4 py-3.5 text-[0.95rem] focus:outline-none focus:border-neutral-400 transition-colors" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-[#111111] text-white p-3.5 rounded-2xl transition-transform active:scale-95 shrink-0">
                <svg class="w-5 h-5 transform rotate-90 rtl:-rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>


    <div id="contact-popup" role="dialog" aria-modal="true">
        <div class="popup-card">
            <h3 id="pop-title" class="serif-title text-xl font-bold text-neutral-900 mb-2">Instant Confirmation</h3>
            <p id="pop-desc" class="text-sm text-neutral-500 leading-relaxed mb-6">Where can Dato reach you to coordinate meeting paths?</p>
            
            <div class="flex gap-2 mb-4">
                <div class="tag-btn selected" onclick="selectMessengerTag(this, 'WhatsApp')">WhatsApp</div>
                <div class="tag-btn" onclick="selectMessengerTag(this, 'Telegram')">Telegram</div>
                <div class="tag-btn" onclick="selectMessengerTag(this, 'Phone Call')">Phone Call</div>
            </div>

            <input type="tel" id="popup-phone-field" placeholder="+995 599 123 456" class="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-4 py-3 text-[1rem] mb-4 focus:outline-none focus:border-neutral-900 transition-colors">

            <div class="flex flex-col gap-2">
                <button id="pop-btn" onclick="submitContactPopup()" class="w-full bg-[#111111] text-white py-3.5 rounded-xl text-sm font-semibold transition-colors active:bg-neutral-800">Confirm Reservation</button>
                <button id="pop-skip" onclick="dismissContactPopup()" class="w-full bg-transparent text-neutral-400 py-2.5 text-xs font-medium transition-colors hover:text-neutral-600">Skip, I'll chat here instead</button>
            </div>
        </div>
    </div>


    <div id="lightbox-zoom" onclick="closeLightbox()" role="dialog" aria-label="Lightbox view">
        <button class="absolute top-6 right-6 text-white/70 hover:text-white text-sm tracking-widest uppercase focus:outline-none">Close ×</button>
        <img id="lightbox-target-img" src="" alt="Expanded Viewframe">
    </div>


    <script>
        let scrollPosition = 0;
        const setVhMetric = () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('resize', setVhMetric);
        window.addEventListener('orientationchange', setVhMetric);
        setVhMetric();

        function toggleScrollLock(isLocked) {
            if (isLocked) {
                scrollPosition = window.pageYOffset;
                document.body.classList.add('scroll-locked');
                document.body.style.top = `-${scrollPosition}px`;
            } else {
                document.body.classList.remove('scroll-locked');
                document.body.style.top = '';
                window.scrollTo(0, scrollPosition);
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBuufwbLbfu7t6peZzfuZjqHX0TCnKw_ps",
            authDomain: "horseriding-20852.firebaseapp.com",
            projectId: "horseriding-20852",
            storageBucket: "horseriding-20852.firebasestorage.app",
            messagingSenderId: "410539342211",
            appId: "1:410539342211:web:0ca2229f0fbdd17ba0deb6",

        // --- FIX 2 & FIX 4: REAL-TIME SYNC ENGINE WITH FIRESTORE HISTORICAL RECOVERY ---
        function loadChatHistory() {
            if (!window.db) return;

            // Instantly ensure the root room index exists so the owner metrics monitor captures it
            window.db.collection("conversations").doc(chatId).set({
                chatId: chatId,
                status: "active"
            }, { merge: true });

            // Avoid layout socket stack redundancy by breaking old open channels
            if (chatListenerUnsubscribe) chatListenerUnsubscribe();

            chatListenerUnsubscribe = window.db.collection("conversations")
                .doc(chatId)
                .collection("messages")
                .orderBy("timestamp", "asc")
                .onSnapshot(snapshot => {
                    const stream = document.getElementById('chat-box-stream');
                    stream.innerHTML = "";

                    // If zero records are tracked, show initialization guides
                    if (snapshot.empty) {
                        appendSystemMessage(uiDictionary[currentLanguage].chatWelcome);
                        renderCustomizerForm();
                        return;
                    }

                    // Loop timeline snapshot entries natively
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        if (msg.sender === "owner" || msg.sender === "system") {
                            appendSystemMessage(msg.text);
                        } else {
                            appendUserMessage(msg.text);
                        }
                    });

                    // Force window viewport focus downward
                    stream.scrollTop = stream.scrollHeight;
                }, error => {
                    console.error("Timeline snapshot query fault: ", error);
                });
        }

        function openChatInterface() {
            document.getElementById('chat-interface').classList.add('active');
            loadChatHistory();
        }

        function closeChatInterface() {
            document.getElementById('chat-interface').classList.remove('active');
        }

        function appendSystemMessage(text) {
            const stream = document.getElementById('chat-box-stream');
            const wrapper = document.createElement('div');

            wrapper.innerHTML = `

                <div class="msg-meta status-seen">${uiDictionary[currentLanguage].lblSeen}</div>
            `;
            stream.appendChild(wrapper);
            stream.scrollTop = stream.scrollHeight;
        }

        function appendUserMessage(text) {
            const stream = document.getElementById('chat-box-stream');
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper user msg-user';
            wrapper.innerHTML = `
                <div class="msg-bubble">${text}</div>
                <div class="msg-meta">${uiDictionary[currentLanguage].lblSent} <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            `;
            stream.appendChild(wrapper);
            stream.scrollTop = stream.scrollHeight;
        }

        function renderCustomizerForm() {

            const formBox = document.createElement('div');
            formBox.className = 'chat-form-box';
            formBox.id = 'embedded-customizer-form';
            
            let dayChips = '';
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            
            const formatDay = (date, labelKey) => {
                const d = date.getDate();
                const m = dict.months[date.getMonth()];
                return `<div class="luxury-chip calendar-bubble" onclick="selectFormParam(this, 'day', '${d} ${m}')"><span>${d}</span><span class="sub-month">${dict[labelKey] || m}</span></div>`;
            };

            dayChips += formatDay(today, 'dayToday');
            dayChips += formatDay(tomorrow, 'dayTomorrow');
            
            for(let i=2; i<6; i++) {
                let nextDate = new Date();
                nextDate.setDate(today.getDate() + i);
                dayChips += formatDay(nextDate, '');
            }

            formBox.innerHTML = `
                <h4>${dict.paramTitle}</h4>
                <div class="chat-form-group">
                    <label>${dict.mDay}</label>
                    <div class="chip-flex-row">${dayChips}</div>
                </div>

                    <label>${dict.mTime}</label>
                    <div class="chip-flex-row">
                        <div class="luxury-chip" onclick="selectFormParam(this, 'time', '09:00 AM')">09:00 AM</div>
                        <div class="luxury-chip" onclick="selectFormParam(this, 'time', '12:00 PM')">12:00 PM</div>
                        <div class="luxury-chip" onclick="selectFormParam(this, 'time', '15:00 PM')">15:00 PM</div>
                        <div class="luxury-chip" onclick="selectFormParam(this, 'time', '18:00 PM')">18:00 PM</div>
                    </div>
                </div>
                <div class="chat-form-group">
                    <label>${dict.mRiders}</label>
                    <div class="chip-flex-row">
                        <div class="luxury-chip" onclick="selectFormParam(this, 'riders', '1')">${dict.riderSingle}</div>
                        <div class="luxury-chip" onclick="selectFormParam(this, 'riders', '2')">2</div>
                        <div class="luxury-chip" onclick="selectFormParam(this, 'riders', '3')">3</div>
                        <div class="luxury-chip" onclick="selectFormParam(this, 'riders', '4+')">4+</div>
                    </div>
                </div>
            `;
            stream.appendChild(formBox);
            stream.scrollTop = stream.scrollHeight;
        }

        function selectFormParam(element, type, value) {
            const row = element.parentElement;
            row.querySelectorAll('.luxury-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            
            if(type === 'day') chosenDay = value;
            if(type === 'time') chosenTime = value;
            if(type === 'riders') chosenRiders = value;

            if(chosenDay && chosenTime && chosenRiders) {
                const tourName = selectedTourKey && tourDatabase[selectedTourKey] ? tourDatabase[selectedTourKey][currentLanguage].title : "Custom Tour";
                const summary = `${tourName} 🐎 [${chosenDay} @ ${chosenTime}] → ${chosenRiders} Rider(s).`;
                
                const targetForm = document.getElementById('embedded-customizer-form');
                if (targetForm) targetForm.remove();
                
                // --- FIX 3: RE-STAMP PARENT DATA STRUCT TEMPORAL MARKER ON SUBMIT ---
                if (window.db) {
                    window.db.collection("conversations").doc(chatId).set({
                        lastActive: firebase.firestore.FieldValue.serverTimestamp(),
                        lastMessage: summary
                        unread: true,
                        status: "active"
                    }, { merge: true }).then(() => {
                        window.db.collection("conversations").doc(chatId).collection("messages").add({
                            text: summary,
                            sender: "user",
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                }
                
                setTimeout(() => {
                    document.getElementById('contact-popup').classList.add('active');
                }, 800);
            }
        }

        function selectMessengerTag(btn, messenger) {
            document.querySelectorAll('.tag-btn').forEach(t => t.classList.remove('selected'));
            btn.classList.add('selected');
            selectedMessenger = messenger;
        }

        function submitContactPopup() {
            const phoneVal = document.getElementById('popup-phone-field').value.trim();
            if(!phoneVal) return;
            
            const payloadText = `Lead Contact Point: [${selectedMessenger}] ${phoneVal}`;
            if (window.db) {
                window.db.collection("conversations").doc(chatId).set({ 
                    lastActive: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessage: payloadText,
                    unread: true,
                    status: "active"
                }, { merge: true }).then(() => {
                    window.db.collection("conversations").doc(chatId).collection("messages").add({
                        text: payloadText,
                        sender: "user",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
            }
            
            dismissContactPopup();
        }

        function dismissContactPopup() {
            document.getElementById('contact-popup').classList.remove('active');
        }

        function sendMessage() {
            const input = document.getElementById('chat-custom-message');
            const txt = input.value.trim();
            if(!txt) return;
            
            input.value = '';

            // --- FIX 3: SYNC PARENT DOCUMENT TIMESTAMP BEFORE PUSHING TEXT MESSAGE ---
            if (window.db) {
               window.db.collection("conversations").doc(chatId).set({

    lastActive: firebase.firestore.FieldValue.serverTimestamp(),

    lastMessage: txt,

    unread: true,

    status: "active"

}, { merge: true }).then(() => {
                    window.db.collection("conversations").doc(chatId).collection("messages").add({
                        text: txt,
                        sender: "user",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
            } else {
                appendUserMessage(txt);
                setTimeout(() => {
                    appendSystemMessage(currentLanguage === 'ka' ? "შეტყობინება მიღებულია!" : "Got your notes!");
                }, 1000);
            }
        }
    </script>
</body>
</html>
